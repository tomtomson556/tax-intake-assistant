{% extends "base.html" %}
{% block title %}Intake — Tax Intake Assistant{% endblock %}
{% block content %}
  <h1>Tax Intake Assistant</h1>
  <p class="lede">Internal intake for German tax advisory teams. This tool does not send anything to clients.</p>
  {% if error %}
    <p class="error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/">
    <label for="request_text">Unstructured client request</label>
    <textarea id="request_text" name="request_text" required>{{ request_text }}</textarea>
    <button type="submit">Assess request</button>
  </form>
{% endblock %}
