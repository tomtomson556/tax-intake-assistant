[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tax-intake-assistant"
version = "0.1.0"
description = "AI-assisted intake and drafting for German tax advisory teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tax_intake_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
